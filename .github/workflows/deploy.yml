name: Deploy to GitHub Pages

# A repository gets exactly one Pages site, so the production build and the
# folder-loader experiment share it: main is published at the root and the
# perf branch at /next/.
#
# Both branches run this same workflow, and it always rebuilds *both*
# targets. That matters — if each branch only published itself, whichever
# deployed last would wipe the other, since a Pages deployment replaces the
# whole site rather than merging into it.
on:
  push:
    branches: [main, perf/fast-folder-load]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: perf/fast-folder-load

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # Tolerated failure: once the experiment is merged or abandoned and
      # the branch is deleted, main should keep deploying on its own rather
      # than breaking on a missing ref.
      - name: Check out preview branch
        id: preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: next

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main/dist/. site/

      - name: Build preview
        if: steps.preview.outcome == 'success'
        working-directory: next
        env:
          # Assets must resolve under the subpath, not the site root.
          VITE_BASE: /pst-viewer/next/
        run: |
          npm ci
          npm run build

      - name: Add preview to site
        if: steps.preview.outcome == 'success'
        run: |
          mkdir -p site/next
          cp -r next/dist/. site/next/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
